
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Legacy</title>

    <link rel="stylesheet" href="../styles/barras-fixas.css">
    <link rel="stylesheet" href="../styles/menu-principal.css">
</head>

<body>

    <!-- BARRA LATERAL -->
    <aside class="side-bar">

        <nav class="main-navigation">

            <div class="navigation-group">

                <button class="nav-button active" data-section="inicio">
                    <span class="nav-icon">⌂</span>
                    Início
                </button>

                <button class="nav-button" data-section="caixa-de-correio">
                    <span class="nav-icon">✉</span>
                    Caixa de correio
                </button>

                <button class="nav-button" data-section="elenco">
                    <span class="nav-icon">♟</span>
                    Elenco
                </button>

                <button class="nav-button" data-section="tatica">
                    <span class="nav-icon">⚽</span>
                    Tática
                </button>

                <button class="nav-button" data-section="relatorio-equipe">
                    <span class="nav-icon">▤</span>
                    Relatório da equipe
                </button>

            </div>

            <div class="navigation-group">

                <button class="nav-button" data-section="treino">
                    <span class="nav-icon">⚒</span>
                    Treino
                </button>

                <button class="nav-button" data-section="agenda">
                    <span class="nav-icon">▦</span>
                    Agenda
                </button>

            </div>

            <div class="navigation-group">

                <button class="nav-button" data-section="observacao">
                    <span class="nav-icon">⌕</span>
                    Observação
                </button>

                <button class="nav-button" data-section="transferencias">
                    <span class="nav-icon">⇄</span>
                    Transferências
                </button>

            </div>

            <div class="navigation-group">

                <button class="nav-button" data-section="informacoes-clube">
                    <span class="nav-icon">♜</span>
                    Informações do clube
                </button>

                <button class="nav-button" data-section="equipe-tecnica">
                    <span class="nav-icon">♙</span>
                    Equipe técnica
                </button>

                <button class="nav-button" data-section="visao-clube">
                    <span class="nav-icon">▣</span>
                    Visão do clube
                </button>

                <button class="nav-button" data-section="financas">
                    <span class="nav-icon">$</span>
                    Finanças
                </button>

                <button class="nav-button" data-section="base">
                    <span class="nav-icon">♧</span>
                    Base
                </button>

            </div>

        </nav>

    </aside>


    <!-- BARRA SUPERIOR -->
    

<header class="top-bar">

    <div class="club-info">

        <div class="club-crest">
            <img id="sidebar-club-logo" src="" alt="Escudo do clube">
        </div>

        <div class="club-data">
            <strong id="top-club-name"></strong>
        </div>

    </div>

    <div class="career-info">
        <strong id="career-date">2026</strong>
    </div>

    <button class="advance-button" id="advance-day">
        Avançar dia
        <span>▶</span>
    </button>

</header>




    <!-- CONTEÚDO DO JOGO -->
    <main class="main-content">

        <section id="game-content">

            <h2>Início</h2>

            <p>Bem-vindo ao Club Legacy.</p>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="../scripts/menu-principal.js"></script>

</body>

</html>
