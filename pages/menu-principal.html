
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="../styles/barras-fixas.css">
    <link rel="stylesheet" href="../styles/menu-principal.css">
</head>

<body>

    <header class="top-bar">

        <div class="club-info">
            <div class="club-crest" id="club-crest">
                <span>ESC</span>
            </div>

            <div class="club-data">
                <strong id="club-name">Nome do clube</strong>
                <span id="club-competition">Brasil • Série A</span>
            </div>
        </div>

        <div class="career-info">
            <span>TEMPORADA 2026</span>
            <strong id="career-date">04/07/2026</strong>
        </div>

        <button class="advance-button" id="advance-day">
            Avançar dia
            <span>▶</span>
        </button>

    </header>

    <aside class="side-bar">

    <div class="sidebar-club">
        <img id="sidebar-club-logo" src="" alt="Escudo do clube">
    </div>

    <nav class="main-navigation">

            <div class="navigation-group">
                <button class="nav-button active" data-section="inicio"><span class="nav-icon">⌂</span><span>Início</span></button>
                <button class="nav-button" data-section="correio"><span class="nav-icon">✉</span><span>Caixa de correio</span></button>
                <button class="nav-button" data-section="elenco"><span class="nav-icon">♟</span><span>Elenco</span></button>
                <button class="nav-button" data-section="tatica"><span class="nav-icon">⚽</span><span>Tática</span></button>
                <button class="nav-button" data-section="relatorio"><span class="nav-icon">▤</span><span>Relatório da equipe</span></button>
            </div>

            <div class="navigation-group">
                <button class="nav-button" data-section="treino"><span class="nav-icon">▦</span><span>Treino</span></button>
                <button class="nav-button" data-section="agenda"><span class="nav-icon">▣</span><span>Agenda</span></button>
            </div>

            <div class="navigation-group">
                <button class="nav-button" data-section="observacao"><span class="nav-icon">⌕</span><span>Observação</span></button>
                <button class="nav-button" data-section="transferencia"><span class="nav-icon">⇄</span><span>Transferência</span></button>
            </div>

            <div class="navigation-group">
                <button class="nav-button" data-section="informacao-clube"><span class="nav-icon">ⓘ</span><span>Informação do clube</span></button>
                <button class="nav-button" data-section="equipe-tecnica"><span class="nav-icon">♙</span><span>Equipe técnica</span></button>
                <button class="nav-button" data-section="visao-clube"><span class="nav-icon">▣</span><span>Visão do clube</span></button>
                <button class="nav-button" data-section="financas"><span class="nav-icon">$</span><span>Finanças</span></button>
                <button class="nav-button" data-section="base"><span class="nav-icon">♟</span><span>Base</span></button>
            </div>

        </nav>

    </aside>

    <main class="main-content">
        <section id="game-content">
            <h2>Bem-vindo ao Club Legacy</h2>
            <p>Sua carreira começou!</p>
        </section>
    </main>

    <script src="../scripts/barras-fixas.js"></script>
    <script src="../scripts/menu-principal.js"></script>

</body>
</html>
